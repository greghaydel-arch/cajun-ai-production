<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Coming Soon — TradeBoard</title>
  <link rel="icon" href="../assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px; }
    .cs-card { background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:48px 40px;max-width:420px;width:100%;text-align:center; }
    .cs-logo { width:48px;margin-bottom:20px; }
    .cs-badge { display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(229,143,82,.3);background:rgba(229,143,82,.08);border-radius:100px;padding:5px 14px;margin-bottom:20px; }
    .cs-badge-dot { width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse-dot 2s infinite; }
    @keyframes pulse-dot { 0%,100%{opacity:1;}50%{opacity:.4;} }
    .cs-badge span { color:var(--accent);font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase; }
    .cs-title { font-size:1.8rem;font-weight:800;letter-spacing:-.02em;margin-bottom:12px; }
    .cs-sub { color:var(--muted2);font-size:.95rem;line-height:1.7;margin-bottom:28px; }
    .cs-input { width:100%;padding:13px 18px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'Inter',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s;margin-bottom:12px; }
    .cs-input:focus { border-color:var(--accent); }
    .cs-input::placeholder { color:var(--muted); }
    .cs-success { display:none;align-items:center;gap:10px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:var(--radius);padding:12px 18px;margin-bottom:12px;text-align:left; }
    .cs-success p { color:#22c55e;font-weight:700;font-size:.9rem;margin-bottom:2px; }
    .cs-success small { color:var(--muted);font-size:.8rem; }
    .cs-note { color:var(--muted);font-size:.78rem;margin-top:16px; }
    .cs-back { display:block;margin-top:20px;color:var(--muted);font-size:.82rem;text-decoration:underline; }
    .cs-back:hover { color:var(--accent); }
  </style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<script>
  if (sessionStorage.getItem('cajunai_preview') === 'unlocked') {
    window.location.replace('login-full.html');
  }
</script>

<main id="main-content" tabindex="-1">
  <div class="cs-card">
    <img src="../assets/images/logo.png" alt="Cajun AI" class="cs-logo">

    <div class="cs-badge">
      <div class="cs-badge-dot" aria-hidden="true"></div>
      <span>Launching Soon</span>
    </div>

    <h1 class="cs-title">TradeBoard is almost here</h1>
    <p class="cs-sub">The app isn't open yet — but you can grab your spot now and be first through the door.</p>

    <form id="waitlistForm">
      <label for="waitlistEmail" class="sr-only">Email address</label>
      <input class="cs-input" type="email" id="waitlistEmail" placeholder="your@email.com" autocomplete="email" required>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Notify Me at Launch →</button>
    </form>

    <div class="cs-success" id="csSuccess" role="alert" aria-live="polite">
      <span style="color:#22c55e;font-size:1.2rem;" aria-hidden="true">✓</span>
      <div>
        <p>You're on the list!</p>
        <small>We'll email you the moment login goes live.</small>
      </div>
    </div>

    <p class="cs-note">No spam. Unsubscribe anytime.</p>
    <a href="../index.html" class="cs-back">← Back to Cajun AI</a>
  </div>
</main>

<script>
  const form = document.getElementById('waitlistForm');
  const success = document.getElementById('csSuccess');
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('waitlistEmail').value;
    if (!email) return;
    try {
      const list = JSON.parse(localStorage.getItem('cajunai_waitlist') || '[]');
      if (!list.includes(email)) { list.push(email); localStorage.setItem('cajunai_waitlist', JSON.stringify(list)); }
    } catch(e) {}
    form.style.display = 'none';
    success.style.display = 'flex';
  });
</script>
</body>
</html>
