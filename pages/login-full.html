<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | TradeBoard by Cajun AI</title>
  <meta name="description" content="Log in to your TradeBoard account.">
  <link rel="icon" href="../assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body style="background:var(--bg);">
<a href="#main-content" class="skip-link">Skip to main content</a>

<!-- Minimal top bar -->
<div style="position:fixed;top:0;left:0;width:100%;z-index:100;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;">
  <a href="../index.html" class="brand" style="text-decoration:none;display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:700;font-size:1.2rem;">
    <img src="../assets/images/logo.png" alt="Cajun AI" style="width:36px;">
    Cajun AI
  </a>
  <a href="pricing.html" style="color:var(--muted);font-size:.88rem;text-decoration:none;">Don't have an account? <span style="color:var(--accent);font-weight:600;">Get started →</span></a>
</div>

<!-- LOGIN CARD -->
<main class="login-wrap" id="main-content" tabindex="-1">
  <div class="login-card">
    <img src="../assets/images/logo.png" alt="Cajun AI Logo">
    <h1>Welcome back</h1>
    <p>Sign in to your TradeBoard account</p>

    <form onsubmit="return false;">
      <div class="form-group" style="text-align:left;">
        <label for="loginEmail">Email address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group" style="text-align:left;">
        <label for="loginPassword" style="display:flex;justify-content:space-between;">
          Password
          <a href="#" style="color:var(--accent);font-size:.82rem;font-weight:500;">Forgot password?</a>
        </label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;font-size:1rem;padding:15px;">
        Sign In
      </button>
    </form>

    <div class="login-divider">or</div>

    <button class="btn btn-ghost" style="width:100%;justify-content:center;gap:10px;" onclick="return false;">
      <svg width="18" height="18" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6.3 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.4 18.9 12 24 12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6.3 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.2 5.2C37.1 38.6 44 33 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Continue with Google
    </button>

    <div class="login-footer">
      New to TradeBoard? <a href="pricing.html">Create a free account</a>
    </div>
    <div style="margin-top:16px;font-size:.75rem;color:var(--muted);">
      By signing in you agree to our <a href="legal.html" style="color:var(--accent);">Terms</a> and <a href="legal.html" style="color:var(--accent);">Privacy Policy</a>.
    </div>
  </div>
</main>

<script src="../script.js"></script>
</body>
</html>
